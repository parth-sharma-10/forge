name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux, because everything after Phase 0 Week 1 (namespaces, cgroups v2,
    # seccomp) only exists on a real Linux kernel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - run: make test
      - run: make build
