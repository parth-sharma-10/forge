name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux, because everything after Phase 0 Week 1 (namespaces, cgroups v2,
    # seccomp) only exists on a real Linux kernel.
    runs-on: ubuntu-latest
    # The queue is PostgreSQL and its tests run against a real one, never a
    # mock. The tests fail rather than skip when CI is set and this is not.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORGE_TEST_DSN: postgres://forge:forge@127.0.0.1:5432/forge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: make test
      - run: make build

      # The isolation tests need a real kernel and CAP_SYS_ADMIN, so they are
      # a separate step: `make test` above runs unprivileged and would skip
      # every one of them. GitHub's runners give passwordless sudo.
      - run: make test-sandbox
