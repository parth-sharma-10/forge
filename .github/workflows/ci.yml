name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux, because everything after Phase 0 Week 1 (namespaces, cgroups v2,
    # seccomp) only exists on a real Linux kernel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # No dependencies yet, so there is no go.sum to key a cache on.
          cache: false
      - run: make test
      - run: make build
